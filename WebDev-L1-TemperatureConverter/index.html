<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temperature Converter - Oasis Infobyte Web Development & Designing Internship Level 1 Task 3">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="app-title">Temperature Converter</h1>
            <p class="app-subtitle">Convert between Celsius, Fahrenheit, and Kelvin</p>
        </header>

        <main class="converter-card">
            <form id="converterForm" novalidate aria-label="Temperature converter form">
                <!-- Input Section -->
                <div class="input-group">
                    <label for="temperatureInput" class="input-label">Enter Temperature</label>
                    <input 
                        type="text" 
                        id="temperatureInput" 
                        class="temperature-input" 
                        placeholder="e.g., 25, 32, 273.15"
                        autocomplete="off"
                        aria-describedby="inputHelp inputError"
                    >
                    <small id="inputHelp" class="input-help">Enter a numeric value</small>
                    <div id="inputError" class="error-message" aria-live="polite"></div>
                </div>

                <!-- Unit Selection -->
                <div class="unit-group">
                    <label for="inputUnit" class="input-label">Select Input Unit</label>
                    <select id="inputUnit" class="unit-select" aria-label="Input temperature unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <!-- Convert Button -->
                <button type="submit" class="convert-btn" aria-label="Convert temperature">
                    Convert Temperature
                </button>
            </form>

            <!-- Results Section -->
            <section class="results-section" aria-live="polite" aria-label="Conversion results">
                <h2 class="results-title">Converted Temperatures</h2>
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-unit">Celsius (°C)</div>
                        <div id="resultCelsius" class="result-value">-</div>
                    </div>
                    <div class="result-card">
                        <div class="result-unit">Fahrenheit (°F)</div>
                        <div id="resultFahrenheit" class="result-value">-</div>
                    </div>
                    <div class="result-card">
                        <div class="result-unit">Kelvin (K)</div>
                        <div id="resultKelvin" class="result-value">-</div>
                    </div>
                </div>
            </section>

            <!-- Error Display Section -->
            <section class="validation-section" aria-live="polite">
                <div id="validationMessage" class="validation-message"></div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Temperature Converter | Oasis Infobyte Web Development Internship - Level 1, Task 3</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
